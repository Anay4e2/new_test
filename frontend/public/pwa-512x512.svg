<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#1e40af"/>
  <g transform="translate(256,256)">
    <!-- Compass circle -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.3"/>
    <circle cx="0" cy="0" r="135" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.2"/>
    <!-- North pointer -->
    <polygon points="0,-150 -32,26 0,-14 32,26" fill="#ffffff"/>
    <!-- South pointer -->
    <polygon points="0,150 -32,-26 0,14 32,-26" fill="#93c5fd" opacity="0.7"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="12" fill="#ffffff"/>
    <!-- Direction marks -->
    <rect x="-3" y="-175" width="6" height="22" fill="#ffffff" opacity="0.5"/>
    <rect x="-3" y="153" width="6" height="22" fill="#ffffff" opacity="0.5"/>
    <rect x="-175" y="-3" width="22" height="6" fill="#ffffff" opacity="0.5"/>
    <rect x="153" y="-3" width="22" height="6" fill="#ffffff" opacity="0.5"/>
  </g>
</svg>
