<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <rect width="192" height="192" rx="32" fill="#1e40af"/>
  <g transform="translate(96,96)">
    <!-- Compass circle -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.3"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.2"/>
    <!-- North pointer -->
    <polygon points="0,-55 -12,10 0,-5 12,10" fill="#ffffff"/>
    <!-- South pointer -->
    <polygon points="0,55 -12,-10 0,5 12,-10" fill="#93c5fd" opacity="0.7"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
    <!-- Direction marks -->
    <rect x="-1.5" y="-65" width="3" height="10" fill="#ffffff" opacity="0.5"/>
    <rect x="-1.5" y="55" width="3" height="10" fill="#ffffff" opacity="0.5"/>
    <rect x="-65" y="-1.5" width="10" height="3" fill="#ffffff" opacity="0.5"/>
    <rect x="55" y="-1.5" width="10" height="3" fill="#ffffff" opacity="0.5"/>
  </g>
</svg>
